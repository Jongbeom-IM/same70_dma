# SAME70-XPLAINED Pro board configuration for OpenOCD
# This configuration uses the onboard EDBG (Embedded Debugger)

# Interface configuration for EDBG
source [find interface/cmsis-dap.cfg]

# Transport selection
transport select swd

# Chip configuration
source [find target/atsame70q21.cfg]

# Board specific settings
adapter speed 2000

# Reset configuration
reset_config srst_only

# Additional commands for SAME70
$_TARGETNAME configure -event reset-init {
    # Configure clocks after reset
    # Enable main oscillator (12MHz crystal)
    mww 0x400E0A04 0x37080101
    sleep 10
    
    # Configure PLL to 300MHz
    mww 0x400E0A0C 0x00193F05
    sleep 10
    
    # Switch to PLL
    mww 0x400E0A08 0x00000002
    sleep 10
}

# Flash programming settings
flash bank $_FLASHNAME atsame5 0x00400000 0 1 1 $_TARGETNAME